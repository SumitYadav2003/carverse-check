version: 2

models:
  - name: fct_mot_tests
    description: One row per MOT test, cleaned. The fact table for test-level analysis.
    columns:
      - name: test_id
        data_tests: [unique, not_null]
      - name: test_date
        data_tests: [not_null]
      - name: test_result
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_mot__test_outcomes')
                field: test_result
      - name: test_type
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_mot__test_types')
                field: test_type
      - name: vehicle_model_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vehicle_model')
                field: vehicle_model_key

  - name: fct_test_defects
    description: One row per distinct defect recorded on a test.
    columns:
      - name: test_defect_key
        data_tests: [unique, not_null]
      - name: test_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_mot_tests')
                field: test_id
      - name: defect_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_defect')
                field: defect_key
      - name: rfr_type_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'P', 'A', 'M']

  - name: dim_vehicle_model
    columns:
      - name: vehicle_model_key
        data_tests: [unique, not_null]

  - name: dim_defect
    columns:
      - name: defect_key
        data_tests: [unique, not_null]
      - name: defect_category
        data_tests: [not_null]

  - name: mart_model_year_fail_rates
    description: >
      Initial and final MOT failure rates for cars (class 4) by make, model and year of
      first use, next to the rate for all cars first used in the same year. Only groups
      with at least var('min_tests_per_group') initial tests. Each rate has a 95% range
      (Wilson), an adjusted estimate with its own range (empirical Bayes) and funnel
      limits (Spiegelhalter). vs_peers is the verdict shown to buyers; funnel_position says
      whether the model stands out from other models of the same age.
    columns:
      - name: model_year_key
        data_tests: [unique, not_null]
      - name: vs_peers
        data_tests:
          - accepted_values:
              arguments:
                values: ['higher', 'lower', 'within']
      - name: funnel_position
        data_tests:
          - accepted_values:
              arguments:
                values: ['above', 'below', 'inside']
      - name: vehicle_model_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vehicle_model')
                field: vehicle_model_key

  - name: mart_model_year_defect_categories
    description: >
      Share of initial tests with at least one Fail/PRS item (and, separately, at least one
      advisory) in each defect category, by make, model and year of first use, next to the
      same-age average.
    columns:
      - name: model_year_category_key
        data_tests: [unique, not_null]
      - name: model_year_key
        data_tests:
          - relationships:
              arguments:
                to: ref('mart_model_year_fail_rates')
                field: model_year_key

  - name: mart_odometer_rounding
    description: >
      Data-quality check on odometer readings: share of readings by last digit, and ending
      in 00 or 000, next to the share expected if readings were never rounded.
    columns:
      - name: check_key
        data_tests: [unique, not_null]
