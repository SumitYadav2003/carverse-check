name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Django tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      # Development settings for the tests (no HTTPS redirect); Django's test runner turns
      # debug off during tests anyway. Production settings are checked separately below.
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test checker
      - name: Django deployment check (production settings, fails on any warning)
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: carverse-check.onrender.com
          DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-only-long-random-looking-key-for-the-deploy-check-x9Q2mVr7Lk
        run: python manage.py check --deploy --fail-level WARNING

  pipeline:
    name: Pipeline (ingest, dbt, load) on sample data
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "0"
      # CI builds its own small warehouse from generated sample data, never the real one
      MOT_WAREHOUSE: ${{ github.workspace }}/data/warehouse/ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      - name: Generate sample data in DVSA's file format
        run: python pipeline/make_sample_data.py data/raw/sample

      - name: Ingest raw files into DuckDB
        run: python pipeline/ingest.py data/raw/sample

      - name: Ingest again (must skip every file)
        run: |
          python pipeline/ingest.py data/raw/sample | tee rerun.log
          grep -q "0 loaded" rerun.log

      - name: dbt build (models and data tests)
        working-directory: transform
        # The DVSA reconciliation test only makes sense on the real data, so it's excluded
        # here; it runs on every local build against the real warehouse. The sample data is
        # small, so the size thresholds are lowered to make every statistic get calculated.
        run: >
          dbt build --profiles-dir .
          --vars '{min_tests_per_group: 20, min_tests_for_categories: 20, min_groups_for_spread: 3}'
          --exclude assert_matches_dvsa_published_rates

      - name: Load the marts into Django
        run: |
          python manage.py migrate --noinput
          python manage.py load_mot_marts
